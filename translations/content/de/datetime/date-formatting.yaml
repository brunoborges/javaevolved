title: Datumsformatierung
oldApproach: SimpleDateFormat
modernApproach: DateTimeFormatter
summary: Datumswerte mit dem threadsicheren, unveränderlichen DateTimeFormatter formatieren.
explanation: DateTimeFormatter ist unveränderlich und threadsicher, im Gegensatz zu SimpleDateFormat. Er kann als Konstante gespeichert und geteilt werden. Vordefinierte Formatierer wie ISO_LOCAL_DATE stehen für gängige Formate zur Verfügung.
whyModernWins:
- icon: 🛡️
  title: Threadsicher
  desc: Formatierer können ohne Synchronisierung zwischen Threads geteilt werden.
- icon: 📋
  title: Eingebaute Formate
  desc: ISO_LOCAL_DATE, ISO_INSTANT usw. für Standardformate.
- icon: 🔒
  title: Unveränderlich
  desc: Kann sicher als static-final-Konstante gespeichert werden.
support:
  description: Weitgehend verfügbar seit JDK 8 (März 2014)
